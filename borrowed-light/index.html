<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0a09" />
    <meta name="description" content="Listen to Borrowed Light by Tey Mu Reel (2026)." />
    <meta property="og:title" content="Borrowed Light · Tey Mu Reel" />
    <meta property="og:description" content="Listen to Borrowed Light by Tey Mu Reel (2026)." />
    <meta property="og:type" content="music.album" />
    <meta property="og:url" content="https://thezagquery-collab.github.io/QueryRecords/borrowed-light/" />
    <meta property="og:image" content="https://thezagquery-collab.github.io/QueryRecords/borrowed-light/cover.jpg" />
    <title>Borrowed Light · Tey Mu Reel</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <a class="skip" href="#tracklist">Skip to tracks</a>
    <div class="wrap">
      <header class="top">
        <p class="brand">QueryRecords</p>
        <p class="kicker">Album</p>
      </header>
      <main class="stage">
        <section class="now" aria-label="Player">
          <img
            class="cover"
            src="cover.jpg"
            width="1200"
            height="1200"
            alt="Borrowed Light cover, a blue pilot flame on black"
          />
          <div class="identity">
            <h1 id="album-title">Borrowed Light</h1>
            <p class="artist" id="artist-name">Tey Mu Reel</p>
            <p class="meta"><span id="year">2026</span> · <span id="track-count">21</span> tracks</p>
          </div>
          <p class="now-title is-idle" id="now-title">Select a track</p>
          <p class="status" id="status" role="status"></p>
          <div class="transport">
            <button type="button" class="round" id="prev" aria-label="Previous track" disabled>
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <path d="M6 5h2.2v14H6zm13 0v14L9.2 12z" fill="currentColor"></path>
              </svg>
            </button>
            <button type="button" class="play" id="play" aria-label="Play" disabled>
              <svg class="icon-play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
                <path d="M8 5.2v13.6l11.2-6.8z" fill="currentColor"></path>
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" hidden>
                <path d="M6 5h4.2v14H6zm7.8 0H18v14h-4.2z" fill="currentColor"></path>
              </svg>
            </button>
            <button type="button" class="round" id="next" aria-label="Next track" disabled>
              <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <path d="M15.8 5H18v14h-2.2zM5 5l9.8 7L5 19z" fill="currentColor"></path>
              </svg>
            </button>
          </div>
          <div class="seek-wrap">
            <span id="elapsed" class="time">0:00</span>
            <input
              id="seek"
              type="range"
              min="0"
              max="1000"
              value="0"
              step="1"
              aria-label="Seek within the track"
              disabled
            />
            <span id="total" class="time">0:00</span>
          </div>
          <button
            type="button"
            class="lyrics-toggle"
            id="lyrics-toggle"
            aria-expanded="false"
            aria-controls="lyrics"
          >
            Lyrics
          </button>
          <section id="lyrics" class="lyrics" hidden>
            <h2 id="lyrics-heading">Lyrics</h2>
            <div id="lyrics-body" class="lyrics-body"></div>
          </section>
        </section>
        <section class="list-wrap" aria-labelledby="tracks-heading">
          <div class="list-head">
            <h2 id="tracks-heading">Tracks</h2>
          </div>
          <ol id="tracklist">
            <li class="loading">Loading the album…</li>
          </ol>
          <noscript>
            <p class="loading">This player needs JavaScript to load the album.</p>
          </noscript>
        </section>
      </main>
    </div>
    <audio id="audio" preload="none"></audio>
    <script src="player.js"></script>
  </body>
</html>
